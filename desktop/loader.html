<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>CodeQuest</title>
<style>html,body{margin:0;height:100%;background:#0b0b0f;color:#8f8f9c;font:15px system-ui,"Segoe UI",sans-serif;display:grid;place-items:center}
@media(prefers-color-scheme:light){html,body{background:#f7f7f9}}</style></head>
<body><div id="m">Chargement…</div>
<script>
// Lanceur de CodeQuest.exe : récupère la dernière version de l'appli sur GitHub à chaque démarrage
// (mise à jour automatique), la garde en mémoire pour le hors-ligne, sinon utilise la copie intégrée.
(async()=>{
 const RAW='https://raw.githubusercontent.com/uknw-4/codeQuest/main/',KEY='cq-desktop-bundle';
 const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,ko)=>setTimeout(()=>ko(new Error('timeout')),ms))]);
 async function bundle(base,online){
  const get=async u=>{const r=await fetch(base+u+(online?'?t='+Date.now():''),{cache:'no-store'});if(!r.ok)throw new Error(u+' '+r.status);return r.text()};
  let html=await get(online?'index.html':'app.html');
  const srcs=[...html.matchAll(/<script src="([^"]+)"><\/script>/g)].map(m=>m[1]);
  const codes=await Promise.all(srcs.map(get));
  srcs.forEach((s,i)=>{html=html.replace(`<script src="${s}"><\/script>`,()=>'<script>'+codes[i].replace(/<\/script/gi,'<\\/script')+'<\/script>')});
  if(!/VERSION='/.test(html))throw new Error('bundle invalide');
  return html;
 }
 let html=null;
 try{html=await withTimeout(bundle(RAW,true),8000);try{localStorage.setItem(KEY,html)}catch(e){}}catch(e){}
 if(!html){try{html=localStorage.getItem(KEY)}catch(e){}}
 if(!html){try{html=await bundle('',false)}catch(e){document.getElementById('m').textContent='Impossible de démarrer CodeQuest.';return}}
 html=html.replace('<head>','<head><script>window.CQ_DESKTOP=true<\/script>');
 document.open();document.write(html);document.close();
})();
</script></body></html>
