<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeQuest</title>
<meta name="description" content="Apprends à coder gratuitement : 18 parcours, défis exécutés pour de vrai, prof IA local.">
<meta name="theme-color" content="#0e0f12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: un coach exigeant mais bienveillant, qui parle simple
   IDEA: une carte de quête par langage, chaque langage dans ses propres couleurs, plus un atelier où le code tourne pour de vrai
   PICTURE: le chemin de leçons sur la bande colorée du langage ; dans l'Atelier, l'éditeur et ses résultats de tests
   COLOUR and TYPE: blanc / nuit, barre latérale noire, couleur du langage en aplat, corail XP + or succès; Sora + Inter + JetBrains Mono
   LAYOUT: PC à 3 colonnes (navigation | contenu | profil), empilé sous 1100px puis 700px */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#121316);--ink:light-dark(#15161a,#eef0f3);--mute:light-dark(#5d6069,#a3a7b0);
--card:light-dark(#f2f3f5,#1c1e23);--line:light-dark(#e1e3e8,#2a2d34);
--side:#0e0f12;--sideink:#e9eaee;--xp:#ff5a36;--gold:#ffc531;--ok:#1a9e60;--bad:#e5484d;--lc:#3776ab;--lt:#fff}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Sora,Inter,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
code,pre,.mono,textarea.code{font-family:"JetBrains Mono",ui-monospace,monospace}
.app{display:grid;grid-template-columns:250px minmax(0,1fr) 320px;min-height:100vh}
/* sidebar */
.side{background:var(--side);color:var(--sideink);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{font:700 23px Sora,sans-serif;padding:0 10px 12px;display:flex;align-items:center;gap:10px}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--xp);display:grid;place-items:center;font-style:normal;font-size:14px;color:#fff}
.seg{display:flex;background:#1d1f25;border-radius:10px;padding:3px;margin:0 6px 10px}
.seg button{flex:1;min-height:36px;border:0;border-radius:8px;background:none;color:#a3a7b0;font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:#33363f;color:#fff}
.side small{color:#8d909a;padding:12px 10px 4px;font-size:13px}
.nav,.lang{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 10px;border:0;border-radius:10px;background:none;text-align:left}
.nav:hover,.lang:hover{background:#1d1f25}.nav[aria-current=true],.lang[aria-current=true]{background:#262830}
.nav svg{flex:none;width:22px;height:22px}
.nav span,.lang span{flex:1}
.pill{font:600 12px Inter;background:var(--xp);color:#fff;border-radius:99px;padding:1px 8px}
.dot{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font:700 11px "JetBrains Mono",monospace}
.lang b{font:600 12px Inter;color:#8d909a}.lang b.full{color:var(--gold)}
#install{margin-top:14px;min-height:44px;border:1px solid #33363f;background:none;color:var(--sideink);border-radius:10px}
/* main */
main{min-width:0}
.hero{background:var(--lc);color:var(--lt);padding:clamp(26px,3.6vw,48px) clamp(20px,4vw,52px) 36px}
.hero h1{font-size:clamp(32px,3.8vw,50px)}
.hero p{max-width:62ch;margin:10px 0 20px;opacity:.93;font-size:17px}
.meter{height:12px;border-radius:99px;background:rgba(0,0,0,.22);overflow:hidden;max-width:520px}
.meter i{display:block;height:100%;background:var(--lt);border-radius:99px;transition:width .5s}
.hero .mt{font-size:14px;margin-top:8px;opacity:.9}
.hrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.hbtn{min-height:44px;padding:0 18px;border-radius:12px;border:2px solid currentColor;background:none;color:var(--lt);font-weight:600}
.hbtn.solid{background:var(--lt);color:var(--lc);border-color:var(--lt)}
.path{padding:34px clamp(20px,4vw,52px) 70px;max-width:780px}
.node{display:flex;align-items:center;gap:18px;margin:0 0 24px}
.node:nth-child(even){margin-left:min(22%,150px)}.node:nth-child(4n+3){margin-left:min(8%,60px)}
.bub{flex:none;width:74px;height:74px;border-radius:50%;border:0;display:grid;place-items:center;font:700 25px Sora;background:var(--card);color:var(--mute);box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.node.open .bub{background:var(--lc);color:var(--lt);animation:pulse 2s infinite}
.node.done .bub{background:var(--gold);color:#3a2a00}
.node.lock .bub{cursor:not-allowed}
.node h3{font-size:19px}.node p{margin:2px 0 0;color:var(--mute);font-size:14px}
.stars{color:#c99400;letter-spacing:2px}
@keyframes pulse{0%,100%{box-shadow:inset 0 -6px 0 rgba(0,0,0,.15),0 0 0 0 color-mix(in srgb,var(--lc) 50%,transparent)}50%{box-shadow:inset 0 -6px 0 rgba(0,0,0,.15),0 0 0 12px transparent}}
.wrap{padding:28px clamp(20px,4vw,52px) 60px}
/* lab */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{min-height:40px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14px}
.tab[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cc{text-align:left;border:0;border-radius:16px;background:var(--card);padding:16px;min-height:120px;display:flex;flex-direction:column;gap:8px;position:relative}
.cc:hover{outline:2px solid var(--line)}
.cc h3{font-size:17px}.cc .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin-top:auto}
.eng{display:inline-flex;align-self:flex-start;font:700 12px "JetBrains Mono",monospace;border-radius:6px;padding:2px 8px}
.lvd{letter-spacing:3px;color:var(--xp)}
.cc.ok::after{content:"✓";position:absolute;top:12px;right:14px;width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:700}
.sbx{background:var(--side);color:#fff}.sbx .meta{color:#a3a7b0}
.lh{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.back{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.desc{font-size:17px;max-width:72ch;margin:0 0 14px}
textarea.code{width:100%;min-height:280px;resize:vertical;background:#0f1117;color:#e6e8ee;border:0;border-radius:14px;padding:16px 18px;font-size:15px;line-height:1.6;tab-size:4;white-space:pre;overflow:auto}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.btn.pri{background:var(--lc);color:var(--lt);border:0;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);padding:0 24px}
.btn:disabled{opacity:.45;cursor:default}
.out{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:4px}
.out:empty{display:none}
.out h4{margin:0 0 8px;font:600 14px Inter;color:var(--mute)}
.trow{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.trow:first-of-type{border-top:0}
.trow i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.trow i.y{background:var(--ok)}.trow i.n{background:var(--bad)}
.trow code{font-size:13.5px}
.logs{background:#0f1117;color:#d7dae2;border-radius:10px;padding:10px 12px;font-size:13.5px;white-space:pre-wrap;margin:8px 0 0;max-height:220px;overflow:auto}
.banner{border-radius:12px;padding:12px 14px;font-weight:600;margin-bottom:10px}
.banner.y{background:color-mix(in srgb,var(--ok) 16%,var(--bg))}.banner.n{background:color-mix(in srgb,var(--bad) 13%,var(--bg))}
.pv{border:1px dashed var(--line);border-radius:10px;padding:12px;background:#fff;color:#111;margin:8px 0}
table.res{border-collapse:collapse;font-size:14px;margin-top:6px}
table.res th,table.res td{border:1px solid var(--line);padding:5px 10px;text-align:left}
table.res td.n{text-align:right}
.scroll{overflow-x:auto}
.aibox{margin-top:14px;background:color-mix(in srgb,#7c5cff 10%,var(--bg));border-radius:14px;padding:14px 16px;font-size:15px}
.aibox:empty{display:none}
.aibox pre,.msg pre{background:#0f1117;color:#e6e8ee;border-radius:10px;padding:12px 14px;font-size:14px;overflow-x:auto;white-space:pre}
.aibox code,.msg code{background:color-mix(in srgb,var(--ink) 8%,transparent);border-radius:5px;padding:1px 5px;font-size:.92em}
.aibox pre code,.msg pre code{background:none;padding:0}
.note{color:var(--mute);font-size:14px}
/* profile */
.prof{border-left:1px solid var(--line);padding:24px 20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.lvl{display:flex;gap:16px;align-items:center}
.ring{flex:none;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--xp) var(--p,0%),var(--card) 0)}
.ring div{width:66px;height:66px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:700 26px Sora}
.lvl h2{font-size:22px}.lvl p{margin:2px 0 0;color:var(--mute);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:18px 0 24px}
.stat{background:var(--card);border-radius:12px;padding:11px 10px;text-align:center}
.stat b{display:block;font:700 22px Sora}.stat span{font-size:13px;color:var(--mute)}
.prof h3{font-size:17px;margin:0 0 12px;display:flex;justify-content:space-between}
.prof h3 span{font:500 14px Inter;color:var(--mute)}
.achs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.ach{aspect-ratio:1;border-radius:12px;background:var(--card);display:grid;place-items:center;border:0;color:var(--mute)}
.ach svg{width:26px;height:26px}.ach.on{background:var(--gold);color:#3a2a00}
.achinfo{margin-top:12px;background:var(--card);border-radius:12px;padding:12px 14px;font-size:14px;min-height:64px}
.achinfo b{display:block;font-size:15px}
.reset{margin-top:18px;background:none;border:0;color:var(--mute);font-size:13px;text-decoration:underline;min-height:44px}
/* lesson overlay */
.lesson{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column}
.lesson.on{display:flex}
.ltop{display:flex;align-items:center;gap:16px;padding:18px clamp(16px,4vw,48px);max-width:900px;width:100%;margin:0 auto}
.x{width:44px;height:44px;border-radius:12px;border:0;background:var(--card);font-size:20px}
.lbar{flex:1;height:14px;border-radius:99px;background:var(--card);overflow:hidden}
.lbar i{display:block;height:100%;background:var(--lc);border-radius:99px;transition:width .4s}
.lbody{flex:1;overflow-y:auto;padding:16px clamp(16px,4vw,48px) 40px;max-width:900px;width:100%;margin:0 auto}
.lbody h2{font-size:clamp(25px,3vw,33px);margin-bottom:14px}
.tag{display:inline-block;font-size:14px;font-weight:600;color:var(--mute);margin-bottom:8px}
.theory{font-size:18px;max-width:65ch}
.lbody pre{background:#0f1117;color:#e6e8ee;border-radius:14px;padding:18px 20px;font-size:16px;line-height:1.6;margin:18px 0;position:relative;white-space:pre;overflow-x:auto}
.cp{position:absolute;top:10px;right:10px;border:0;border-radius:8px;background:#262a35;color:#c9ccd5;font:500 13px Inter;padding:6px 10px;min-height:32px}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;min-height:56px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-size:17px}
.opt kbd{flex:none;width:28px;height:28px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;font:600 13px Inter;color:var(--mute)}
.opt:hover{border-color:var(--lc)}
.opt.sel{border-color:var(--lc);background:color-mix(in srgb,var(--lc) 10%,var(--bg))}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--bg))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
.fill{width:100%;max-width:360px;margin-top:16px;font:600 18px "JetBrains Mono",monospace;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.fill.good{border-color:var(--ok)}.fill.wrong{border-color:var(--bad)}
.lfoot{border-top:1px solid var(--line);padding:16px clamp(16px,4vw,48px)}
.lfoot>div{max-width:900px;margin:0 auto;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.lfoot.good{background:color-mix(in srgb,var(--ok) 14%,var(--bg))}
.lfoot.wrong{background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
.fb{flex:1 1 320px;font-size:15px}.fb b{font-size:18px;display:block}
.fb .btn{margin-top:8px;min-height:38px}
.go{min-height:52px;padding:0 32px;border-radius:14px;border:0;background:var(--lc);color:var(--lt);font:700 17px Sora;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.go:disabled{opacity:.4;cursor:default}
.hint{font-size:13px;color:var(--mute)}
.end{text-align:center;padding-top:6vh}
.end .big{font:700 clamp(58px,9vw,94px) Sora;color:var(--xp);line-height:1}
.newa{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.newa div{background:var(--gold);color:#3a2a00;border-radius:12px;padding:10px 14px;font-weight:600}
.toast{position:fixed;right:20px;bottom:20px;z-index:40;background:var(--side);color:#fff;border-radius:14px;padding:14px 18px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);transform:translateY(160%);transition:transform .35s;max-width:calc(100vw - 40px)}
.toast.on{transform:none}.toast i{flex:none;width:36px;height:36px;border-radius:10px;background:var(--gold);color:#3a2a00;display:grid;place-items:center;font-style:normal}
@media(max-width:1100px){.app{grid-template-columns:230px minmax(0,1fr)}.prof{grid-column:1/-1;position:static;height:auto;border-left:0;border-top:1px solid var(--line)}}
@media(max-width:700px){.app{grid-template-columns:minmax(0,1fr)}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow-x:auto;padding:12px}.side small,.logo,#install{display:none}.seg{margin:0}.nav,.lang{flex:none;width:auto}.lang b{display:none}.node:nth-child(n){margin-left:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side" aria-label="Navigation"></nav>
  <main id="main"></main>
  <aside class="prof" id="prof"></aside>
</div>
<div class="lesson" id="lesson" role="dialog" aria-modal="true">
  <div class="ltop"><button class="x" id="quit" aria-label="Quitter">✕</button><div class="lbar"><i id="lbar"></i></div><span class="hint mono" id="lxp"></span></div>
  <div class="lbody" id="lbody"></div>
  <div class="lfoot" id="lfoot"><div><div class="fb" id="fb"></div><button class="go" id="go"></button></div></div>
</div>
<div class="toast" id="toast" role="status"><i>★</i><div><b id="tt"></b><div id="td" style="color:#b9bcc5;font-size:13px"></div></div></div>

<script src="content/fr.js"></script>
<script src="content/fr-extra.js"></script>
<script src="content/en.js"></script>
<script src="content/challenges.js"></script>
<script>

try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(fresh(),JSON.parse(r))}catch(e){}

const L=o=>o&&typeof o==='object'?(o[S.ui]??o.fr):o;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lvl=xp=>Math.floor(Math.sqrt(xp/40))+1;
const lvlMin=n=>40*(n-1)**2;
const day=(o=0)=>new Date(Date.now()+o*864e5).toLocaleDateString('sv');
const $=id=>document.getElementById(id);
const icon=k=>'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'+I[k]+'</svg>';
const dueKeys=()=>Object.keys(S.rev).filter(k=>S.rev[k].due<=day()&&getQ(k));
function getQ(k){const [id,li,qi]=k.split('|');return C()[id]?.ls[+li]?.q[+qi]}
function setColor(c,tx){document.documentElement.style.setProperty('--lc',c);document.documentElement.style.setProperty('--lt',tx)}
// md : texte de Claude → HTML échappé (code entre ```)
function md(s){return String(s).split('```').map((p,i)=>{if(i%2){const nl=p.indexOf('\n');const body=nl>-1&&/^[\w+#-]*$/.test(p.slice(0,nl).trim())?p.slice(nl+1):p;return '<pre><code>'+esc(body.replace(/\n$/,''))+'</code></pre>'}
 return esc(p).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}).join('')}

let R=null;
function openRun(o){R=Object.assign({step:o.theory?-1:0,err:0,xp:0,sel:null,checked:false},o);$('lesson').classList.add('on');$('lfoot').className='lfoot';$('fb').innerHTML='';$('lbar').style.width='0%';if(!o.loading)showStep()}
function startLesson(i){const m=M.find(x=>x.id===S.cur),ls=C()[m.id].ls[i];
 openRun({mode:'lesson',li:i,lang:m.id,title:L(m.n)+' · '+t().lesson+' '+(i+1),theory:ls,qs:ls.q.map((q,j)=>({q,key:m.id+'|'+i+'|'+j}))})}
function startReview(){const ks=dueKeys().sort(()=>Math.random()-.5).slice(0,10);if(!ks.length)return;
 openRun({mode:'review',title:t().revT,qs:ks.map(k=>({q:getQ(k),key:k}))})}
function showStep(){
 const tt=t(),{qs,step}=R,tot=qs.length;R.sel=null;R.checked=false;
 $('lbar').style.width=((step+1+(R.theory?1:0))/(tot+(R.theory?1:0))*100)+'%';$('lxp').textContent='+'+R.xp+' XP';
 $('lfoot').className='lfoot';$('fb').innerHTML='<span class="hint">'+tt.keys+'</span>';
 const go=$('go');
 if(step===-1){const th=R.theory;
  $('lbody').innerHTML=`<span class="tag">${esc(R.title)}</span><h2>${esc(th.n)}</h2><p class="theory">${esc(th.th)}</p><pre><button class="cp" data-cp>${S.ui==='fr'?'Copier':'Copy'}</button><code>${esc(th.ex)}</code></pre>`;
  go.textContent=tt.start;go.disabled=false;go.focus();return}
 const q=qs[step].q;
 let h=`<span class="tag">${esc(R.title)} · ${tt.exercise} ${step+1} / ${tot}</span><h2>${esc(q.p)}</h2>`;
 if(q.t==='f')h+=`<pre><code>${esc(q.c)}</code></pre><input class="fill" id="fill" autocomplete="off" spellcheck="false" autocapitalize="off" aria-label="${esc(q.p)}">`;
 else{if(q.c)h+=`<pre><code>${esc(q.c)}</code></pre>`;h+=`<div class="opts">${q.o.map((o,j)=>`<button class="opt" data-o="${j}"><kbd>${j+1}</kbd><code>${esc(o)}</code></button>`).join('')}</div>`}
 $('lbody').innerHTML=h;$('lbody').scrollTop=0;go.textContent=tt.check;go.disabled=true;
 const f=$('fill');if(f){f.focus();f.addEventListener('input',()=>{go.disabled=!f.value.trim()})}
}
function pick(j){if(!R||R.checked||R.step<0||R.step==='end'||!R.qs[R.step])return;R.sel=j;document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',+b.dataset.o===j));$('go').disabled=false}
const norm=s=>String(s).trim().toLowerCase().replace(/\s+/g,'');
function check(){
 const tt=t(),{q,key}=R.qs[R.step];let ok,given;
 if(q.t==='f'){const f=$('fill');given=f.value;ok=q.a.some(a=>norm(a)===norm(f.value));f.classList.add(ok?'good':'wrong');f.disabled=true}
 else{given=q.o[R.sel];ok=R.sel===q.a;document.querySelectorAll('.opt').forEach(b=>{const j=+b.dataset.o;if(j===q.a)b.classList.add('good');else if(j===R.sel)b.classList.add('wrong')})}
 if(ok){R.xp+=R.mode==='lesson'?10:5}else R.err++;
 if(key&&R.mode!=='endless'){
  if(ok&&R.mode==='review'){const r=S.rev[key];const b=(r?r.b:0)+1;S.revOk++;if(b>=5)delete S.rev[key];else S.rev[key]={b,due:day([1,3,7,14,30][b])}}
  if(!ok)S.rev[key]={b:0,due:day(1)};
 }
 R.checked=true;$('lxp').textContent='+'+R.xp+' XP';
 $('lfoot').className='lfoot '+(ok?'good':'wrong');
 const right=q.t==='f'?q.a[0]:q.o[q.a];
 $('fb').innerHTML=`<b>${ok?tt.good:tt.bad}</b>${esc(q.e)}${ok?'':esc(tt.answer+right)}`;
 R.lastWrong={q,given,right};
 $('go').textContent=R.step===R.qs.length-1?tt.finish:tt.cont;$('go').disabled=false;$('go').focus();
}
function bumpDay(){const td=day();if(S.last!==td){S.streak=S.last===day(-1)?S.streak+1:1;S.last=td}const h=new Date().getHours();if(h>=23)S.night=true;if(h<8)S.early=true}
function award(){const news=A.filter(a=>!S.ach[a.id]&&a.f(S));news.forEach(a=>S.ach[a.id]=Date.now());news.forEach((a,j)=>setTimeout(()=>toast(a),500+j*2600));return news}
function finish(){
 const tt=t(),tot=R.qs.length,good=tot-R.err,perfect=R.err===0;let gain=R.xp,extra='';
 if(R.mode==='lesson'){const k=R.lang+'-'+R.li,first=!S.done[k],best=good===tot?3:good>=tot-1?2:1;
  gain+=perfect?20:0;if(!first)gain=Math.round(gain/2);
  if(first){S.lessons++;S.done[k]={best}}else S.done[k].best=Math.max(S.done[k].best,best);
  if(perfect)S.perfect++;S.tried[R.lang]=1;extra=(perfect?tt.bonus:'')+(first?'':tt.half)}
 S.xp+=gain;bumpDay();const news=award();save();
 $('lbar').style.width='100%';$('lfoot').className='lfoot';
 $('lbody').innerHTML=`<div class="end"><div class="big">+${gain} XP</div><h2 style="margin-top:14px">${perfect?tt.perfT:tt.doneT}</h2><p class="hint" style="font-size:16px">${tt.goodOf(good,tot)}${extra}${tt.streak(S.streak)}</p>${news.length?'<div class="newa">'+news.map(a=>'<div>★ '+esc(L(a.n))+'</div>').join('')+'</div>':''}</div>`;
 $('fb').innerHTML='';$('go').textContent=tt.cont;R.step='end';$('go').focus();
}
function next(){
 if(!R||R.loading)return;
 if(R.step==='end'){closeRun();return}
 if(R.step>=0&&!R.checked){check();return}
 if(R.step===R.qs.length-1){finish();return}
 R.step++;showStep();
}
function closeRun(){$('lesson').classList.remove('on');R=null;save();render()}
let tT;function toast(a){$('tt').textContent=(S.ui==='fr'?'Succès débloqué : ':'Achievement unlocked: ')+L(a.n);$('td').textContent=L(a.d);$('toast').classList.add('on');clearTimeout(tT);tT=setTimeout(()=>$('toast').classList.remove('on'),2400)}
// ================= MOTEURS D'EXÉCUTION =================
const loaded={};
function loadScript(src){return loaded[src]||(loaded[src]=new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>{delete loaded[src];ko(new Error('load'))};document.head.appendChild(s)}))}
let pyP=null;
function loadPy(){return pyP||(pyP=loadScript('https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js').then(()=>window.loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/'})).catch(e=>{pyP=null;throw e}))}
function loadSql(){return loadScript('https://cdn.jsdelivr.net/npm/alasql@4.6.6/dist/alasql.min.js').then(()=>window.alasql)}
const WORKER=`onmessage=e=>{const d=e.data,logs=[];const f=a=>a.map(x=>typeof x==='string'?x:(()=>{try{return JSON.stringify(x)}catch(_){return String(x)}})()).join(' ');
console.log=(...a)=>logs.push(f(a));console.error=console.warn=console.info=console.log;
try{const fn=new Function(d.code+'\\n;return '+(d.fn?'typeof '+d.fn+'==="function"?'+d.fn+':undefined':'undefined'))();
if(d.fn&&!fn){postMessage({nofn:true,logs});return}
const res=(d.cases||[]).map(c=>{try{const v=fn(...JSON.parse(JSON.stringify(c[0])));return {v:v===undefined?'undefined':JSON.stringify(v)}}catch(err){return {err:String(err)}}});
postMessage({res,logs})}catch(err){postMessage({error:String(err),logs})}}`;
let wURL=null;
function runJS(code,fn,cases){return new Promise(ok=>{
 wURL=wURL||URL.createObjectURL(new Blob([WORKER],{type:'text/javascript'}));
 let w;try{w=new Worker(wURL)}catch(e){ok({error:t().engFail,logs:[]});return}
 const to=setTimeout(()=>{w.terminate();ok({error:t().timeout,logs:[]})},4000);
 w.onmessage=e=>{clearTimeout(to);w.terminate();ok(e.data)};
 w.onerror=e=>{clearTimeout(to);w.terminate();ok({error:e.message||'Error',logs:[]});e.preventDefault()};
 w.postMessage({code,fn,cases});
})}
async function runPy(code,fn,cases){
 const py=await loadPy();const logs=[];
 py.setStdout({batched:s=>logs.push(s)});py.setStderr({batched:s=>logs.push(s)});
 const ns=py.globals.get('dict')();
 try{await py.runPythonAsync(code,{globals:ns});
  if(!fn)return {logs};
  ns.set('__CASES',JSON.stringify(cases));ns.set('__FN',fn);
  const out=await py.runPythonAsync(`import json
__out=None
if __FN in globals() and callable(globals()[__FN]):
    __f=globals()[__FN]
    __out=[]
    for __a,__e in json.loads(__CASES):
        try:
            __r=__f(*__a)
            __ok=(__r==__e) and (type(__r)==bool)==(type(__e)==bool)
            __out.append({"ok":bool(__ok),"v":repr(__r)})
        except Exception as __x:
            __out.append({"ok":False,"err":type(__x).__name__+": "+str(__x)})
json.dumps(__out)`,{globals:ns});
  const res=JSON.parse(out);if(res===null)return {nofn:true,logs};return {res,logs};
 }catch(e){return {error:String(e.message||e).split('\n').filter(Boolean).slice(-3).join('\n'),logs}}
 finally{ns.destroy&&ns.destroy()}
}
const nz=v=>v&&typeof v==='object'?(Array.isArray(v)?v.map(nz):Object.keys(v).sort().reduce((o,k)=>(o[k]=nz(v[k]),o),{})):v;
const pyLit=v=>JSON.stringify(v).replace(/\btrue\b/g,'True').replace(/\bfalse\b/g,'False').replace(/\bnull\b/g,'None');
function resTable(rows){if(!Array.isArray(rows)||!rows.length)return '<p class="note">'+t().noRows+'</p>';const cols=Object.keys(rows[0]);
 return `<table class="res"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,30).map(r=>`<tr>${cols.map(c=>`<td class="${typeof r[c]==='number'?'n':''}">${esc(typeof r[c]==='number'?Math.round(r[c]*100)/100:r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
const rowKey=rows=>(rows||[]).map(r=>JSON.stringify(Object.values(r).map(v=>typeof v==='number'?Math.round(v*100)/100:v)));
async function runLab(){
 const tt=t(),sb=labSel==='sandbox',c=sb?null:CH.find(x=>x.id===labSel),k=sb?sbxEng:c.k;
 const code=$('code').value,out=$('out'),btn=$('run');
 S.drafts[sb?'sbx-'+sbxEng:c.id]=code;save();
 btn.disabled=true;$('ai').innerHTML='';
 let pass=false,html='';
 try{
 if(c&&c.ban&&code.includes(c.ban)){html=`<div class="banner n">${esc(tt.ban(c.ban))}</div>`}
 else if(k==='js'||k==='py'){
  if(k==='py'&&!pyP)out.innerHTML=`<p class="note">${tt.loadPy}</p>`;
  const r=k==='js'?await runJS(code,c?.fn,c?.cases):await runPy(code,c?.fn,c?.cases);
  if(r.error)html+=`<div class="banner n"><code style="white-space:pre-wrap">${esc(r.error)}</code></div>`;
  else if(r.nofn)html+=`<div class="banner n">${esc(tt.noFn(c.fn))}</div>`;
  else if(c){const res=r.res.map((x,i)=>{const [args,e]=c.cases[i];let ok,got;
    if(k==='js'){got=x.err?x.err:x.v;ok=!x.err&&x.v!=='undefined'&&JSON.stringify(nz(JSON.parse(x.v)))===JSON.stringify(nz(e))}else{got=x.err||x.v;ok=x.ok}
    return {ok,call:`${c.fn}(${args.map(a=>k==='py'?pyLit(a):JSON.stringify(a)).join(', ')})`,e:k==='py'?pyLit(e):JSON.stringify(e),got}});
   const np=res.filter(x=>x.ok).length;pass=np===res.length;
   html+=`<div class="banner ${pass?'y':'n'}">${pass?tt.passAll+(S.ch[c.id]?'':tt.passXp(CHXP[c.lv])):tt.fail(np,res.length)}</div><h4>${tt.tests}</h4>`+res.map(x=>`<div class="trow"><i class="${x.ok?'y':'n'}">${x.ok?'✓':'✗'}</i><div><code>${esc(x.call)}</code><br><span class="note">${tt.exp} <code>${esc(x.e)}</code> · ${tt.got} <code>${esc(x.got)}</code></span></div></div>`).join('')}
  else if(!r.error)html+=`<div class="banner y">${tt.sbxRun}</div>`;
  if(r.logs&&r.logs.length)html+=`<h4 style="margin-top:12px">${tt.logs}</h4><pre class="logs">${esc(r.logs.join('\n'))}</pre>`;
 }
 else if(k==='sql'){
  out.innerHTML=`<p class="note">${tt.loadSql}</p>`;
  const a=await loadSql();
  const run=q=>{const db=new a.Database();db.exec(CQ.sqlSetup);let r=db.exec(q);if(Array.isArray(r)&&r.length&&Array.isArray(r[r.length-1]))r=r[r.length-1];return r};
  let got,err=null;try{got=run(code)}catch(e){err=String(e.message||e)}
  if(err)html=`<div class="banner n"><code style="white-space:pre-wrap">${esc(err)}</code></div>`;
  else{const exp=run(c.sol);let A1=rowKey(got),B1=rowKey(exp);if(!c.ord){A1=[...A1].sort();B1=[...B1].sort()}
   pass=Array.isArray(got)&&JSON.stringify(A1)===JSON.stringify(B1);
   html=`<div class="banner ${pass?'y':'n'}">${pass?tt.sqlOk+(S.ch[c.id]?'':tt.passXp(CHXP[c.lv])):tt.sqlBad}</div><h4>${tt.rows}</h4><div class="scroll">${resTable(Array.isArray(got)?got:[])}</div>`}
 }
 else if(k==='web'){
  out.innerHTML=`<h4>${tt.preview}</h4><div class="pv" id="pvHost"></div><div id="pvChecks"></div>`;
  const root=$('pvHost').attachShadow({mode:'open'});root.innerHTML=code;
  if(c){const res=c.checks.map(ch=>{let ok=false;try{ok=!!ch.f(root)}catch(e){}return {ok,m:L(ch.m)}});pass=res.every(x=>x.ok);
   $('pvChecks').innerHTML=`<div class="banner ${pass?'y':'n'}" style="margin-top:10px">${pass?tt.passAll+(S.ch[c.id]?'':tt.passXp(CHXP[c.lv])):tt.fail(res.filter(x=>x.ok).length,res.length)}</div><h4>${tt.checks}</h4>`+res.map(x=>`<div class="trow"><i class="${x.ok?'y':'n'}">${x.ok?'✓':'✗'}</i><div>${esc(x.m)}</div></div>`).join('')}
  btn.disabled=false;if(c)afterRun(c,pass,'');return;
 }
 }catch(e){html=`<div class="banner n">${esc(tt.engFail)}</div>`}
 out.innerHTML=html;btn.disabled=false;
 if(c)afterRun(c,pass,html);
}
let lastOut='';
function afterRun(c,pass,html){
 lastOut=($('out').textContent||'').slice(0,1500);
 if(pass&&!S.ch[c.id]){S.ch[c.id]=1;S.eng[c.k]=1;S.xp+=CHXP[c.lv];bumpDay();award();save();renderSide();renderProfile()}
 if(!pass){fails[c.id]=(fails[c.id]||0)+1;if(fails[c.id]===2&&!$('showSol')){const b=document.createElement('button');b.className='btn';b.id='showSol';b.textContent=t().sol;document.querySelector('.tools').appendChild(b)}}
}
// ================= ÉVÉNEMENTS =================
$('side').addEventListener('click',e=>{
 const u=e.target.closest('[data-ui]');if(u){S.ui=u.dataset.ui;save();render();return}
 const v=e.target.closest('[data-v]');if(v){S.view=v.dataset.v;if(S.view==='lab')labSel=null;save();render();scrollTo({top:0});return}
 const l=e.target.closest('[data-l]');if(l){S.view='path';S.cur=l.dataset.l;save();render();scrollTo({top:0})}});
$('main').addEventListener('click',e=>{
 const tg=e.target;
 const b=tg.closest('.bub');if(b&&!b.closest('.lock')){startLesson(+b.dataset.i);return}
 if(tg.closest('#toLab')){S.view='lab';labSel=null;labF=['html','css'].includes(S.cur)?'web':['js','py','sql'].includes(S.cur)?S.cur:'all';save();render();return}
 if(tg.closest('#revGo')){startReview();return}
 const f=tg.closest('[data-f]');if(f){labF=f.dataset.f;renderLab();return}
 const cc=tg.closest('[data-c]');if(cc){labSel=cc.dataset.c;renderLab();scrollTo({top:0});return}
 const sbB=tg.closest('[data-sb]');if(sbB){S.drafts['sbx-'+sbxEng]=$('code').value;sbxEng=sbB.dataset.sb;renderEditor();return}
 if(tg.closest('#labBack')){if($('code')){S.drafts[labSel==='sandbox'?'sbx-'+sbxEng:labSel]=$('code').value;save()}labSel=null;renderLab();return}
 if(tg.closest('#run')){runLab();return}
 const c=CH.find(x=>x.id===labSel);
 if(tg.closest('#showSol')&&c){$('ai').innerHTML=`<b>${esc(t().solT)}</b><pre><code>${esc(c.sol)}</code></pre>`;return}
});
$('main').addEventListener('keydown',e=>{
 if(e.target.id==='code'){
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();runLab();return}
  if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();const ta=e.target,s=ta.selectionStart;const isPy=labSel==='sandbox'?sbxEng==='py':CH.find(x=>x.id===labSel)?.k==='py';ta.setRangeText(isPy?'    ':'  ',s,ta.selectionEnd,'end')}}
 if(e.target.id==='askI'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('askF').requestSubmit()}
});
$('prof').addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a){achSel=a.dataset.a;$('achinfo').innerHTML=achText(achSel);return}
 if(e.target.id==='reset'){const b=e.target;if(b.dataset.c){const ui=S.ui;S=fresh();S.ui=ui;save();render()}else{b.dataset.c=1;b.textContent=t().resetC}}});
$('lbody').addEventListener('click',e=>{const o=e.target.closest('.opt');if(o)pick(+o.dataset.o);
 const c=e.target.closest('[data-cp]');if(c&&R&&R.theory){navigator.clipboard?.writeText(R.theory.ex).then(()=>{c.textContent='✓'},()=>{})}});
$('go').addEventListener('click',next);
$('quit').addEventListener('click',closeRun);
document.addEventListener('keydown',e=>{if(!R)return;
 if(e.key==='Escape'){closeRun();return}
 if(e.key==='Enter'&&!e.target.closest('#go,.cp,#quit')){if(!$('go').disabled){e.preventDefault();next()}return}
 if(/^[1-4]$/.test(e.key)&&document.activeElement.id!=='fill')pick(+e.key-1)});
// migration v1 → v2 : clés de révision inchangées, rien à faire
fixView();render();
// ================= APPLI INSTALLABLE (PWA) =================
let installEvt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;installOk=true;const b=$('install');if(b)b.hidden=false});
document.addEventListener('click',e=>{if(e.target.id==='install'&&installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;installOk=false;renderSide()})}});
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
