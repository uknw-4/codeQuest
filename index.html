<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CodeQuest</title>
<meta name="description" content="Apprends à coder gratuitement : 20 parcours, défis exécutés pour de vrai, révisions et succès.">
<meta name="theme-color" content="#0b0b0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CodeQuest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* CodeQuest : moderne et simple, effet verre (translucide) façon Apple.
   Un fond coloré flou derrière, des panneaux en verre dépoli devant. Inter + JetBrains Mono. */
:root{color-scheme:light dark;
--bg:light-dark(#eef0f6,#08080c);--surf:light-dark(rgba(255,255,255,.58),rgba(44,44,62,.38));--surf2:light-dark(rgba(255,255,255,.5),rgba(255,255,255,.06));
--solid:light-dark(#f7f7fb,#121219);--line:light-dark(rgba(255,255,255,.8),rgba(255,255,255,.1));--glass:saturate(180%) blur(28px);--ink:light-dark(#121216,#f1f1f4);--mute:light-dark(#6a6a76,#8f8f9c);
--ac:#8b5cf6;--xp:#8b5cf6;--gold:#f5b83d;--ok:#22a06b;--bad:#e5484d;--lc:#3776ab;--lt:#fff;
--hair:light-dark(rgba(16,16,28,.09),rgba(255,255,255,.075));--hi:light-dark(rgba(255,255,255,.95),rgba(255,255,255,.06));--r:14px;--shi:light-dark(rgba(255,255,255,.95),rgba(255,255,255,.08));--sho:light-dark(rgba(40,30,90,.16),rgba(0,0,0,.55));--sh:0 1px 0 var(--shi) inset,0 12px 32px -14px var(--sho)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);min-height:100vh;color:var(--ink);font:15.5px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:650;line-height:1.15;margin:0;letter-spacing:-.02em;text-wrap:balance}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
code,pre,.mono,textarea.code{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}
svg{flex:none}
/* fond : taches de couleur floues, fixes, derrière le verre */
body::before{content:"";position:fixed;inset:-15%;z-index:-1;pointer-events:none;filter:blur(60px);
 background:radial-gradient(38% 32% at 14% 12%,light-dark(rgba(139,92,246,.42),rgba(139,92,246,.55)),transparent 70%),
  radial-gradient(34% 30% at 86% 16%,light-dark(rgba(236,72,153,.28),rgba(236,72,153,.36)),transparent 70%),
  radial-gradient(40% 36% at 74% 88%,light-dark(rgba(16,185,129,.24),rgba(16,185,129,.3)),transparent 70%),
  radial-gradient(36% 34% at 8% 86%,light-dark(rgba(59,130,246,.3),rgba(59,130,246,.36)),transparent 70%)}
.gl{background:var(--surf);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass)}
/* ---------- barre du haut ---------- */
.top{position:sticky;top:0;z-index:15;isolation:isolate;padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--hair)}
.top::before{content:"";position:absolute;inset:0;z-index:-1;background:light-dark(rgba(246,247,252,.55),rgba(14,14,20,.5));-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass)}
.tin{max-width:1080px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;font-weight:700;font-size:17px;letter-spacing:-.02em}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--ac);color:#fff;display:grid;place-items:center;font:700 12px "JetBrains Mono",monospace;font-style:normal}
.tabsN{display:flex;gap:2px;margin:0 auto;background:var(--surf2);border:1px solid var(--hair);border-radius:13px;padding:3px}
.nav{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border:1px solid transparent;border-radius:10px;transition:background .15s,color .15s,border-color .15s;background:none;color:var(--mute);font-weight:550;font-size:14.5px}
.nav svg{width:18px;height:18px}
.nav:hover{color:var(--ink)}
.nav[aria-current=true]{background:var(--surf);color:var(--ink);border-color:var(--hair);box-shadow:0 1px 2px rgba(0,0,0,.1),inset 0 1px 0 var(--hi)}
.pill{font:600 11.5px Inter,sans-serif;background:var(--ac);color:#fff;border-radius:99px;padding:1px 7px;font-style:normal}
.tr{display:flex;align-items:center;gap:10px}
.seg{display:flex;background:var(--surf2);border:1px solid var(--hair);border-radius:11px;padding:2px}
.seg button{min-height:32px;min-width:38px;border:1px solid transparent;border-radius:8px;background:none;color:var(--mute);font-weight:600;font-size:13px}
.seg button[aria-pressed=true]{background:var(--surf);color:var(--ink);border-color:var(--hair);box-shadow:0 1px 2px rgba(0,0,0,.1),inset 0 1px 0 var(--hi)}
.thm{width:40px;height:40px;border-radius:99px;border:1px solid var(--line);background:var(--surf);display:grid;place-items:center;color:var(--ink)}.thm svg{width:18px;height:18px}.thm:hover{border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
.pset{margin-top:22px}.pset h3{margin-bottom:10px}.pset .seg{display:inline-flex}.pset .seg button{padding:0 12px}
.news{margin-top:22px;background:color-mix(in srgb,var(--ac) 10%,var(--surf));border-radius:12px;padding:14px 16px}.news h3{margin-bottom:8px}.news ul{margin:0;padding-left:18px;font-size:13.5px;display:grid;gap:4px}
.ver{color:var(--mute);font-size:12.5px;margin-top:14px}
.me{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 6px 0 12px;border:1px solid var(--line);border-radius:99px;background:var(--surf);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.me .fire{color:#f97316;display:flex;align-items:center;gap:4px}.me .fire svg{width:16px;height:16px}
.me .lv{width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:13px}
/* ---------- contenu ---------- */
main{max-width:1080px;margin:0 auto;padding:28px 20px 80px}
.head{margin-bottom:22px}
.head h1{font-size:clamp(26px,3.2vw,34px)}
.head p{color:var(--mute);margin:8px 0 0;max-width:62ch}
.langs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chip{flex:none;display:flex;align-items:center;gap:8px;min-height:38px;padding:0 12px 0 10px;border-radius:99px;border:1px solid var(--hair);background:var(--surf);box-shadow:inset 0 1px 0 var(--hi);font-size:14px;font-weight:550;transition:border-color .15s,background .15s;white-space:nowrap}
.chip:hover{border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
.chip i{width:9px;height:9px;border-radius:50%;flex:none}
.chip small{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.chip small.full{color:var(--gold)}
.chip[aria-current=true]{background:color-mix(in srgb,var(--ac) 14%,var(--surf));border-color:color-mix(in srgb,var(--ac) 55%,transparent);color:var(--ink)}
.chip[aria-current=true] small{color:color-mix(in srgb,var(--ac) 70%,var(--ink))}
.course{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.card{background:var(--surf);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh)}
.intro{padding:26px}
.ttl{display:flex;gap:16px;align-items:center}
.badge{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font:700 16px "JetBrains Mono",monospace}
.ttl h1{font-size:clamp(26px,3vw,32px)}
.intro p{color:var(--mute);margin:14px 0 20px;max-width:60ch}
.bar{height:8px;border-radius:99px;background:light-dark(rgba(30,30,60,.08),rgba(255,255,255,.08));overflow:hidden}
.bar i{display:block;height:100%;background:var(--lc);border-radius:99px;transition:width .5s}
.pt{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:8px;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surf);font-weight:600;font-size:14.5px}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
.btn.pri{background:var(--lc);color:var(--lt);border-color:transparent}
.btn.pri:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:default}
.list{list-style:none;margin:20px 0 0;padding:6px}
.ls{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:10px 14px;border:0;border-radius:12px;background:none;text-align:left}
.ls:hover:not(:disabled){background:var(--surf2)}
.ls:disabled{cursor:not-allowed;opacity:.5}
.num{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:650;font-size:14px;background:var(--surf2);color:var(--mute);font-variant-numeric:tabular-nums}
.num svg{width:15px;height:15px}
.ls.open .num{background:var(--lc);color:var(--lt)}
.ls.done .num{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.lt{flex:1}.lt b{display:block;font-weight:600}.lt small{color:var(--mute);font-size:13px}
.go2{color:var(--mute);font-size:13px;white-space:nowrap}.ls.open .go2{color:var(--ink);font-weight:600}
.stars{color:var(--gold);letter-spacing:1px}
.side2{padding:20px;display:grid;gap:14px}
.side2 h3{font-size:15px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv div{background:var(--surf2);border-radius:12px;padding:12px}
.kv b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.kv span{font-size:12.5px;color:var(--mute)}
.link{border:0;background:none;padding:0;color:var(--ac);font-weight:600;font-size:14px;text-align:left;min-height:32px}
/* ---------- atelier ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{min-height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--hair);background:var(--surf);box-shadow:inset 0 1px 0 var(--hi);transition:border-color .15s,background .15s;font-weight:550;font-size:13.5px}
.tab:hover{border-color:color-mix(in srgb,var(--ink) 22%,var(--line))}
.tab[aria-pressed=true]{background:color-mix(in srgb,var(--ac) 14%,var(--surf));border-color:color-mix(in srgb,var(--ac) 55%,transparent);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cc{text-align:left;border:1px solid var(--line);border-radius:18px;background:var(--surf);padding:16px;min-height:132px;display:flex;flex-direction:column;gap:8px;position:relative;box-shadow:var(--sh);transition:transform .15s,border-color .15s}
.cc:hover{border-color:color-mix(in srgb,var(--ink) 25%,var(--line));transform:translateY(-2px)}
.cc h3{font-size:16px;font-weight:600}.cc .meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mute);margin-top:auto}
.eng{display:inline-flex;align-self:flex-start;font:600 11.5px "JetBrains Mono",monospace;border-radius:6px;padding:2px 8px}
.lvd{letter-spacing:2px;color:var(--ac)}
.cc.ok::after{content:"✓";position:absolute;top:14px;right:14px;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.sbx{background:linear-gradient(135deg,rgba(139,92,246,.75),rgba(236,72,153,.5));color:#fff;border-color:rgba(255,255,255,.25)}.sbx .meta,.sbx span{color:rgba(255,255,255,.85)!important}
.lh{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.lh h2{font-size:22px}
.back{min-height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surf);font-weight:550;font-size:14px}
.desc{font-size:16px;max-width:72ch;margin:0 0 14px;color:var(--ink)}
textarea.code{width:100%;min-height:300px;resize:vertical;background:rgba(10,10,16,.86);color:#e7e7ee;border:1px solid var(--line);border-radius:14px;padding:16px 18px;font-size:14.5px;line-height:1.65;tab-size:4;white-space:pre;overflow:auto}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.out{border:1px solid var(--line);background:var(--surf);border-radius:14px;padding:14px 16px;margin-top:4px}
.out:empty{display:none}
.out h4{margin:0 0 8px;font:600 13px Inter,sans-serif;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.trow{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.trow:first-of-type{border-top:0}
.trow i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px}
.trow i.y{background:var(--ok)}.trow i.n{background:var(--bad)}
.trow code{font-size:13px}
.logs{background:#0f0f14;color:#d7d7e0;border-radius:10px;padding:10px 12px;font-size:13px;white-space:pre-wrap;margin:8px 0 0;max-height:220px;overflow:auto}
.banner{border-radius:12px;padding:12px 14px;font-weight:600;margin-bottom:10px}
.banner.y{background:color-mix(in srgb,var(--ok) 15%,var(--surf));color:var(--ink)}.banner.n{background:color-mix(in srgb,var(--bad) 13%,var(--surf));color:var(--ink)}
.pv{border:1px dashed var(--line);border-radius:10px;padding:12px;background:#fff;color:#111;margin:8px 0}
table.res{border-collapse:collapse;font-size:13.5px;margin-top:6px}
table.res th,table.res td{border:1px solid var(--line);padding:5px 10px;text-align:left}
table.res td.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.aibox{margin-top:14px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:15px}
.aibox:empty{display:none}
.aibox pre{background:#0f0f14;color:#e7e7ee;border-radius:10px;padding:12px 14px;font-size:13.5px;overflow-x:auto;white-space:pre}
.note{color:var(--mute);font-size:14px}
/* ---------- révisions ---------- */
.rev{padding:28px;max-width:640px}
.rev .big{font-size:44px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
/* ---------- profil (tiroir) ---------- */
.scrim{position:fixed;inset:0;background:light-dark(rgba(20,20,40,.18),rgba(0,0,0,.4));z-index:25;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.prof{position:fixed;top:0;right:0;bottom:0;width:min(380px,100vw);z-index:26;background:light-dark(rgba(248,248,252,.72),rgba(20,20,28,.68));-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);padding-top:max(22px,env(safe-area-inset-top,0px));border-left:1px solid var(--line);padding:22px 22px 30px;overflow-y:auto;transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.prof.on{transform:none}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.ph span{font-weight:600;color:var(--mute);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.xx{width:36px;height:36px;border-radius:10px;border:0;background:var(--surf2);font-size:16px}
.lvl{display:flex;gap:16px;align-items:center}
.ring{flex:none;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ac) var(--p,0%),var(--surf2) 0)}
.ring div{width:62px;height:62px;border-radius:50%;background:var(--solid);display:grid;place-items:center;font:700 24px Inter,sans-serif}
.lvl h2{font-size:20px}.lvl p{margin:2px 0 0;color:var(--mute);font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:20px 0 24px}
.stat{background:var(--surf2);border-radius:12px;padding:12px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.stat span{font-size:12.5px;color:var(--mute)}
.prof h3{font-size:15px;margin:0 0 12px;display:flex;justify-content:space-between}
.prof h3 span{font-weight:500;color:var(--mute)}
.achs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.ach{aspect-ratio:1;border-radius:10px;background:var(--surf2);display:grid;place-items:center;border:0;color:var(--mute);opacity:.6}
.ach svg{width:20px;height:20px}.ach.on{background:color-mix(in srgb,var(--gold) 22%,var(--surf));color:var(--gold);opacity:1}
.achinfo{margin-top:12px;background:var(--surf2);border-radius:12px;padding:12px 14px;font-size:13.5px;min-height:60px}
.achinfo b{display:block;font-size:14.5px}
.pfoot{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:20px}
#install{min-height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surf2);font-weight:600}
.reset{background:none;border:0;color:var(--mute);font-size:13px;text-decoration:underline;min-height:40px;padding:0}
/* ---------- leçon (plein écran) ---------- */
.lesson{position:fixed;inset:0;background:light-dark(rgba(238,240,246,.7),rgba(8,8,12,.62));-webkit-backdrop-filter:saturate(160%) blur(40px);backdrop-filter:saturate(160%) blur(40px);padding-top:env(safe-area-inset-top,0px);z-index:30;display:none;flex-direction:column}
.lesson.on{display:flex}
.ltop{display:flex;align-items:center;gap:16px;padding:16px clamp(16px,4vw,48px);max-width:860px;width:100%;margin:0 auto}
.x{width:40px;height:40px;border-radius:12px;border:0;background:var(--surf2);font-size:16px}
.lbar{flex:1;height:8px;border-radius:99px;background:light-dark(rgba(30,30,60,.08),rgba(255,255,255,.08));overflow:hidden}
.lbar i{display:block;height:100%;background:var(--lc);border-radius:99px;transition:width .4s}
.lbody{flex:1;overflow-y:auto;padding:20px clamp(16px,4vw,48px) 40px;max-width:860px;width:100%;margin:0 auto}
.lbody h2{font-size:clamp(23px,2.8vw,30px);margin-bottom:14px}
.tag{display:inline-block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:10px}
.theory{font-size:17px;max-width:65ch}
.lbody pre{background:rgba(10,10,16,.86);color:#e7e7ee;border:1px solid var(--line);border-radius:14px;padding:18px 20px;font-size:15px;line-height:1.65;margin:18px 0;position:relative;white-space:pre;overflow-x:auto}
.cp{position:absolute;top:10px;right:10px;border:0;border-radius:8px;background:#23232c;color:#c9c9d3;font:500 12.5px Inter,sans-serif;padding:6px 10px;min-height:30px}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;min-height:56px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surf);font-size:16px}
.opt kbd{flex:none;width:26px;height:26px;border-radius:7px;background:var(--surf2);display:grid;place-items:center;font:600 12px Inter,sans-serif;color:var(--mute)}
.opt:hover{border-color:color-mix(in srgb,var(--lc) 60%,var(--line))}
.opt.sel{border-color:var(--lc);background:color-mix(in srgb,var(--lc) 10%,var(--surf))}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surf))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--surf))}
.fill{width:100%;max-width:360px;margin-top:16px;font:600 17px "JetBrains Mono",monospace;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surf);color:var(--ink)}
.fill.good{border-color:var(--ok)}.fill.wrong{border-color:var(--bad)}
.lfoot{border-top:1px solid var(--hair);padding:16px clamp(16px,4vw,48px) calc(16px + env(safe-area-inset-bottom,0px));background:var(--surf)}
.lfoot>div{max-width:860px;margin:0 auto;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.lfoot.good{background:color-mix(in srgb,var(--ok) 12%,var(--surf))}
.lfoot.wrong{background:color-mix(in srgb,var(--bad) 10%,var(--surf))}
.fb{flex:1 1 320px;font-size:15px}.fb b{font-size:17px;display:block}
.fb .btn{margin-top:8px;min-height:38px}
.go{min-height:50px;padding:0 30px;border-radius:14px;border:0;background:var(--lc);color:var(--lt);font-weight:650;font-size:16px}
.go:disabled{opacity:.35;cursor:default}
.hint{font-size:13px;color:var(--mute)}
.end{text-align:center;padding-top:6vh}
.end .big{font-weight:750;font-size:clamp(54px,8vw,84px);color:var(--ac);line-height:1;letter-spacing:-.04em}
.newa{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.newa div{background:color-mix(in srgb,var(--gold) 20%,var(--surf));color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:600}
.toast{position:fixed;right:20px;bottom:20px;z-index:40;background:light-dark(rgba(255,255,255,.7),rgba(30,30,42,.66));-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 32px rgba(0,0,0,.25);transform:translateY(30px);opacity:0;pointer-events:none;transition:transform .35s,opacity .35s;max-width:calc(100vw - 40px)}
.toast.on{transform:none;opacity:1;pointer-events:auto}.toast i{flex:none;width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--gold) 22%,var(--surf));color:var(--gold);display:grid;place-items:center;font-style:normal}
/* ---------- tailles d'écran ---------- */
@media(max-width:900px){.course{grid-template-columns:minmax(0,1fr)}}
@media(max-width:700px){
 .tin{height:58px;padding:0 16px;gap:10px}.logo span{display:none}.tr{margin-left:auto}
 .tabsN{position:fixed;left:0;right:0;bottom:0;margin:0;border-radius:0;background:light-dark(rgba(246,247,252,.6),rgba(18,18,26,.55));backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:15}
 .nav{flex-direction:column;gap:2px;min-height:50px;font-size:11.5px;flex:1;position:relative}.nav[aria-current=true]{box-shadow:none;background:var(--surf2)}
 .nav .pill{position:absolute;top:2px;left:calc(50% + 6px)}
 main{padding:20px 16px 110px}
 .langs{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 20px;padding:0 16px 4px;scrollbar-width:none}.langs::-webkit-scrollbar{display:none}
 .intro{padding:20px}.toast{bottom:84px}.fb>.hint{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

 else if(k==='sql'){
  out.innerHTML=`<p class="note">${tt.loadSql}</p>`;
  const a=await loadSql();
  const run=q=>{const db=new a.Database();db.exec(CQ.sqlSetup);let r=db.exec(q);if(Array.isArray(r)&&r.length&&Array.isArray(r[r.length-1]))r=r[r.length-1];return r};
  let got,err=null;try{got=run(code)}catch(e){err=String(e.message||e)}
  if(err)html=`<div class="banner n"><code style="white-space:pre-wrap">${esc(err)}</code></div>`;
  else{const exp=run(c.sol);let A1=rowKey(got),B1=rowKey(exp);if(!c.ord){A1=[...A1].sort();B1=[...B1].sort()}
   pass=Array.isArray(got)&&JSON.stringify(A1)===JSON.stringify(B1);
   html=`<div class="banner ${pass?'y':'n'}">${pass?tt.sqlOk+(S.ch[c.id]?'':tt.passXp(CHXP[c.lv])):tt.sqlBad}</div><h4>${tt.rows}</h4><div class="scroll">${resTable(Array.isArray(got)?got:[])}</div>`}
 }
 else if(k==='web'){
  out.innerHTML=`<h4>${tt.preview}</h4><div class="pv" id="pvHost"></div><div id="pvChecks"></div>`;
  const root=$('pvHost').attachShadow({mode:'open'});root.innerHTML=code;
  if(c){const res=c.checks.map(ch=>{let ok=false;try{ok=!!ch.f(root)}catch(e){}return {ok,m:L(ch.m)}});pass=res.every(x=>x.ok);
   $('pvChecks').innerHTML=`<div class="banner ${pass?'y':'n'}" style="margin-top:10px">${pass?tt.passAll+(S.ch[c.id]?'':tt.passXp(CHXP[c.lv])):tt.fail(res.filter(x=>x.ok).length,res.length)}</div><h4>${tt.checks}</h4>`+res.map(x=>`<div class="trow"><i class="${x.ok?'y':'n'}">${x.ok?'✓':'✗'}</i><div>${esc(x.m)}</div></div>`).join('')}
  btn.disabled=false;if(c)afterRun(c,pass,'');return;
 }
 }catch(e){html=`<div class="banner n">${esc(tt.engFail)}</div>`}
 out.innerHTML=html;btn.disabled=false;
 if(c)afterRun(c,pass,html);
}
let lastOut='';
function afterRun(c,pass,html){
 lastOut=($('out').textContent||'').slice(0,1500);
 if(pass&&!S.ch[c.id]){S.ch[c.id]=1;S.eng[c.k]=1;S.xp+=CHXP[c.lv];bumpDay();award();save();renderSide();renderProfile()}
 if(!pass){fails[c.id]=(fails[c.id]||0)+1;if(fails[c.id]===2&&!$('showSol')){const b=document.createElement('button');b.className='btn';b.id='showSol';b.textContent=t().sol;document.querySelector('.tools').appendChild(b)}}
}
// ================= ÉVÉNEMENTS =================
$('side').addEventListener('click',e=>{
 if(e.target.closest('#me')){openProf(true);return}
 if(e.target.closest('#thm')){setTheme(isDark()?'light':'dark');return}
 const u=e.target.closest('[data-ui]');if(u){S.ui=u.dataset.ui;save();render();return}
 const v=e.target.closest('[data-v]');if(v){S.view=v.dataset.v;if(S.view==='lab')labSel=null;save();render();scrollTo({top:0});return}
 const l=e.target.closest('[data-l]');if(l){S.view='path';S.cur=l.dataset.l;save();render();scrollTo({top:0})}});
$('main').addEventListener('click',e=>{
 const tg=e.target;
 const l=tg.closest('[data-l]');if(l){S.cur=l.dataset.l;save();render();return}
 const b=tg.closest('[data-i]');if(b&&!b.disabled){startLesson(+b.dataset.i);return}
 if(tg.closest('#seeProf')){openProf(true);return}
 if(tg.closest('#toLab')){S.view='lab';labSel=null;labF=['html','css'].includes(S.cur)?'web':['js','py','sql','front','back'].includes(S.cur)?S.cur:'all';save();render();return}
 if(tg.closest('#revGo')){startReview();return}
 const f=tg.closest('[data-f]');if(f){labF=f.dataset.f;renderLab();return}
 const cc=tg.closest('[data-c]');if(cc){labSel=cc.dataset.c;renderLab();scrollTo({top:0});return}
 const sbB=tg.closest('[data-sb]');if(sbB){S.drafts['sbx-'+sbxEng]=$('code').value;sbxEng=sbB.dataset.sb;renderEditor();return}
 if(tg.closest('#labBack')){if($('code')){S.drafts[labSel==='sandbox'?'sbx-'+sbxEng:labSel]=$('code').value;save()}labSel=null;renderLab();return}
 if(tg.closest('#run')){runLab();return}
 const c=CH.find(x=>x.id===labSel);
 if(tg.closest('#showSol')&&c){$('ai').innerHTML=`<b>${esc(t().solT)}</b><pre><code>${esc(c.sol)}</code></pre>`;return}
});
$('main').addEventListener('keydown',e=>{
 if(e.target.id==='code'){
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();runLab();return}
  if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();const ta=e.target,s=ta.selectionStart;const isPy=labSel==='sandbox'?sbxEng==='py':CH.find(x=>x.id===labSel)?.k==='py';ta.setRangeText(isPy?'    ':'  ',s,ta.selectionEnd,'end')}}
 if(e.target.id==='askI'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('askF').requestSubmit()}
});
$('prof').addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a){achSel=a.dataset.a;$('achinfo').innerHTML=achText(achSel);return}
 if(e.target.closest('#profX')){openProf(false);return}
 const th=e.target.closest('[data-th]');if(th){setTheme(th.dataset.th);return}
 if(e.target.id==='reset'){const b=e.target;if(b.dataset.c){const ui=S.ui;S=fresh();S.ui=ui;save();render()}else{b.dataset.c=1;b.textContent=t().resetC}}});
$('lbody').addEventListener('click',e=>{const o=e.target.closest('.opt');if(o)pick(+o.dataset.o);
 const c=e.target.closest('[data-cp]');if(c&&R&&R.theory){navigator.clipboard?.writeText(R.theory.ex).then(()=>{c.textContent='✓'},()=>{})}});
$('scrim').addEventListener('click',()=>openProf(false));
document.addEventListener('keydown',e=>{if(!R&&e.key==='Escape'&&$('prof').classList.contains('on'))openProf(false)});
$('go').addEventListener('click',next);
$('quit').addEventListener('click',closeRun);
document.addEventListener('keydown',e=>{if(!R)return;
 if(e.key==='Escape'){closeRun();return}
 if(e.key==='Enter'&&!e.target.closest('#go,.cp,#quit')){if(!$('go').disabled){e.preventDefault();next()}return}
 if(/^[1-4]$/.test(e.key)&&document.activeElement.id!=='fill')pick(+e.key-1)});
// migration v1 → v2 : clés de révision inchangées, rien à faire
function isDark(){return S.theme==='dark'||(S.theme!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches)}
function applyTheme(){const r=document.documentElement;if(S.theme==='auto')delete r.dataset.theme;else r.dataset.theme=S.theme;
 const m=document.querySelector('meta[name=theme-color]');if(m)m.content=isDark()?'#08080c':'#eef0f6'}
function setTheme(v){S.theme=v;save();applyTheme();renderSide();renderProfile()}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(S.theme==='auto'){applyTheme();renderSide()}});
fixView();applyTheme();render();
if(S.seenV&&S.seenV!==VERSION){setTimeout(()=>{$('tt').textContent=(S.ui==='fr'?'Mise à jour : CodeQuest ':'Updated: CodeQuest ')+VERSION;$('td').textContent=S.ui==='fr'?'Ouvre ton profil (🔥) pour voir les nouveautés.':'Open your profile (🔥) to see what\'s new.';$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),5000)},800)}
if(S.seenV!==VERSION){S.seenV=VERSION;save()}
// ================= APPLI INSTALLABLE (PWA) =================
let installEvt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;installOk=true;const b=$('install');if(b)b.hidden=false});
document.addEventListener('click',e=>{if(e.target.id==='install'&&installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;installOk=false;renderProfile()})}});
if('serviceWorker' in navigator&&location.protocol!=='file:'&&!window.CQ_DESKTOP)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
